<svg width="1200" height="512" viewBox="0 0 1200 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="f"><rect width="1200" height="512" rx="18"/></clipPath>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2328" stop-opacity="0"/><stop offset="0.5" stop-color="#1F2328" stop-opacity="0.8"/><stop offset="1" stop-color="#1F2328" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes rise { from {opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
      .l1 { animation: rise .5s ease-out both .2s; }
      .l2 { animation: rise .5s ease-out both .6s; }
      .l3 { animation: rise .5s ease-out both 1s; }
      .l4 { animation: rise .5s ease-out both 1.4s; }
      .l5 { animation: rise .5s ease-out both 1.8s; }
      @keyframes sweep { 0% { transform: translateX(-260px);} 100% { transform: translateX(1300px);} }
      .sweep { animation: sweep 9s ease-in-out infinite 2s; }
    </style>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1200" height="512" fill="#F6F8FA"/>
    <rect x="0.5" y="0.5" width="1199" height="511" rx="17.5" stroke="#D1D9E0"/>
    <rect width="1200" height="46" fill="#EAEEF2"/>
    <rect x="0" y="45.5" width="1200" height="1" fill="#D1D9E0"/>
    <rect x="0" y="45" width="220" height="2" rx="1" fill="url(#shine)" class="sweep"/>
    <circle cx="30" cy="23" r="6" fill="#8C959F"/>
    <circle cx="52" cy="23" r="6" fill="#D1D9E0"/>
    <circle cx="74" cy="23" r="6" fill="#D1D9E0"/>
    <text x="600" y="28" text-anchor="middle" class="mono" font-size="13" fill="#656D76">samuel@dev ~ ai-policy</text>
    <text x="1164" y="28" text-anchor="end" class="mono" font-size="12" font-weight="700" fill="#818B98" letter-spacing="1.5">ASSISTANT, NOT AUTHOR</text>
    <g class="l1"><text x="36" y="96" class="mono" font-size="13" font-weight="700" fill="#818B98" letter-spacing="1.5">01</text><text x="70" y="96" class="sans" font-size="17.5" font-weight="700" fill="#1F2328">I stay the author.</text><text x="70" y="120" class="sans" font-size="14" fill="#59636E">Every line is read, understood and explainable before I ask anyone to review it.</text><text x="70" y="140" class="sans" font-size="14" fill="#59636E">The commit carries my name because the judgement in it is mine.</text></g><g class="l2"><text x="36" y="180" class="mono" font-size="13" font-weight="700" fill="#818B98" letter-spacing="1.5">02</text><text x="70" y="180" class="sans" font-size="17.5" font-weight="700" fill="#1F2328">Proof before fix.</text><text x="70" y="204" class="sans" font-size="14" fill="#59636E">I reproduce the bug and make the new tests fail on the original code first,</text><text x="70" y="224" class="sans" font-size="14" fill="#59636E">then fix, then run the whole suite. A green run on a guess is not a fix.</text></g><g class="l3"><text x="36" y="264" class="mono" font-size="13" font-weight="700" fill="#818B98" letter-spacing="1.5">03</text><text x="70" y="264" class="sans" font-size="17.5" font-weight="700" fill="#1F2328">Disclosed, always.</text><text x="70" y="288" class="sans" font-size="14" fill="#59636E">Pull requests say where AI helped, following each project's rules: Automattic's</text><text x="70" y="308" class="sans" font-size="14" fill="#59636E">PR template, Harper's agent policy, the Firefox AI coding policy.</text></g><g class="l4"><text x="36" y="348" class="mono" font-size="13" font-weight="700" fill="#818B98" letter-spacing="1.5">04</text><text x="70" y="348" class="sans" font-size="17.5" font-weight="700" fill="#1F2328">Nothing confidential in a prompt.</text><text x="70" y="372" class="sans" font-size="14" fill="#59636E">Client code, credentials and private data never leave the machine.</text><text x="70" y="392" class="sans" font-size="14" fill="#59636E">External tools only see what is already public or mine to share.</text></g><g class="l2"><rect x="742" y="70" width="422" height="166" rx="12" fill="#FFFFFF" stroke="#D1D9E0"/><text x="764" y="100" class="mono" font-size="12" font-weight="700" fill="#656D76" letter-spacing="2">WHERE IT HELPS</text><text x="764" y="128" class="mono" font-size="13.5" fill="#818B98">+</text><text x="786" y="128" class="sans" font-size="14" fill="#32383F">tracing a crash through code I have never read</text><text x="764" y="152" class="mono" font-size="13.5" fill="#818B98">+</text><text x="786" y="152" class="sans" font-size="14" fill="#32383F">drafting test fixtures and hunting edge cases</text><text x="764" y="176" class="mono" font-size="13.5" fill="#818B98">+</text><text x="786" y="176" class="sans" font-size="14" fill="#32383F">scanning issue trackers for verified, unclaimed bugs</text><text x="764" y="200" class="mono" font-size="13.5" fill="#818B98">+</text><text x="786" y="200" class="sans" font-size="14" fill="#32383F">first drafts of docs, later rewritten in my words</text></g><g class="l3"><rect x="742" y="252" width="422" height="166" rx="12" fill="#FFFFFF" stroke="#D1D9E0"/><text x="764" y="282" class="mono" font-size="12" font-weight="700" fill="#656D76" letter-spacing="2">WHERE IT DOES NOT</text><text x="764" y="310" class="mono" font-size="13.5" fill="#818B98">-</text><text x="786" y="310" class="sans" font-size="14" fill="#32383F">decide what ships</text><text x="764" y="334" class="mono" font-size="13.5" fill="#818B98">-</text><text x="786" y="334" class="sans" font-size="14" fill="#32383F">sign the commit</text><text x="764" y="358" class="mono" font-size="13.5" fill="#818B98">-</text><text x="786" y="358" class="sans" font-size="14" fill="#32383F">replace running the code</text><text x="764" y="382" class="mono" font-size="13.5" fill="#818B98">-</text><text x="786" y="382" class="sans" font-size="14" fill="#32383F">talk to a maintainer for me</text></g><g class="l5"><rect x="36" y="436" width="1128" height="1" fill="#D1D9E0"/><text x="36" y="466" class="mono" font-size="13" fill="#656D76"><tspan fill="#818B98">$</tspan> tools  <tspan fill="#1F2328">Claude Code</tspan> · <tspan fill="#1F2328">Codex</tspan>, in the terminal, next to the tests and the linter</text><text x="36" y="490" class="mono" font-size="13" fill="#656D76"><tspan fill="#818B98">$</tspan> seen in practice  Automattic/studio #4797 · WordPress/sqlite-database-integration #500 · Firefox bug 2054228</text></g>
  </g>
</svg>
