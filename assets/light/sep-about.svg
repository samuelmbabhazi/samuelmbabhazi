<svg width="1200" height="66" viewBox="0 0 1200 66" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2328" stop-opacity="0"/><stop offset="0.5" stop-color="#1F2328" stop-opacity="0.85"/><stop offset="1" stop-color="#1F2328" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes sweep { 0% { transform: translateX(-260px);} 100% { transform: translateX(1300px);} }
      .sweep { animation: sweep 8s ease-in-out infinite; }
