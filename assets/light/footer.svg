<svg width="1200" height="90" viewBox="0 0 1200 90" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="f"><rect width="1200" height="90" rx="16"/></clipPath>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2328" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1F2328" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1F2328" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes scan { 0% { transform: translateX(-600px);} 100% { transform: translateX(1800px);} }
      .scan { animation: scan 5.5s linear infinite; }
      @keyframes blink { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
      .cur { animation: blink 1.1s steps(1) infinite; }
    </style>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1200" height="90" fill="#FFFFFF"/>
    <rect x="0.5" y="0.5" width="1199" height="89" rx="15.5" stroke="#D1D9E0"/>
    <rect y="0" width="600" height="1.5" fill="url(#fade)" class="scan"/>
    <text x="600" y="42" text-anchor="middle" class="mono" font-size="14" fill="#656D76">clean code · typed end to end · proven in the open</text>
    <text x="560" y="70" text-anchor="middle" class="mono" font-size="13" fill="#818B98">samuel@dev ~ $</text>
    <rect x="618" y="58" width="8" height="14" fill="#59636E" class="cur"/>
  </g>
</svg>
