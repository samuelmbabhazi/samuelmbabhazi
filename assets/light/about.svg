<svg width="1200" height="330" viewBox="0 0 1200 330" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="f"><rect width="1200" height="330" rx="18"/></clipPath>
    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes cursor { 0%,49% {opacity:1;} 50%,100% {opacity:0;} }
      .cur { animation: cursor 1.1s steps(1) infinite; }
      @keyframes rise { from {opacity:0; transform: translateY(6px);} to {opacity:1; transform: translateY(0);} }
      .l1 { animation: rise .5s ease-out both .2s; }
      .l2 { animation: rise .5s ease-out both .7s; }
      .l3 { animation: rise .5s ease-out both 1.2s; }
      .l4 { animation: rise .5s ease-out both 1.7s; }
      .l5 { animation: rise .5s ease-out both 2.2s; }
    </style>
  </defs>
  <g clip-path="url(#f)">
    <rect width="1200" height="330" fill="#F6F8FA"/>
    <rect x="0.5" y="0.5" width="1199" height="329" rx="17.5" stroke="#D1D9E0"/>
    <rect width="1200" height="46" fill="#EAEEF2"/>
    <rect x="0" y="45.5" width="1200" height="1" fill="#D1D9E0"/>
    <circle cx="30" cy="23" r="6" fill="#8C959F"/>
    <circle cx="52" cy="23" r="6" fill="#D1D9E0"/>
    <circle cx="74" cy="23" r="6" fill="#D1D9E0"/>
    <text x="600" y="28" text-anchor="middle" class="mono" font-size="13" fill="#656D76">samuel@dev ~ about</text>
    <g class="mono" font-size="15.5">
      <g class="l1">
        <text x="36" y="86"><tspan fill="#656D76">$</tspan><tspan fill="#1F2328"> whoami</tspan></text>
        <text x="36" y="110" fill="#59636E">Full-Stack Developer · 5+ years shipping production-grade applications</text>
      </g>
      <g class="l2">
        <text x="36" y="142"><tspan fill="#656D76">$</tspan><tspan fill="#1F2328"> cat focus.txt</tspan></text>
        <text x="36" y="166" fill="#59636E">TypeScript-first backend architecture (NestJS) · production-grade Angular, React &amp; Next.js</text>
        <text x="36" y="188" fill="#59636E">scalable GraphQL &amp; REST APIs · enterprise open-source contributions</text>
      </g>
      <g class="l3">
        <text x="36" y="220"><tspan fill="#656D76">$</tspan><tspan fill="#1F2328"> echo $LANGUAGES</tspan></text>
        <text x="36" y="244" fill="#59636E">Français · Swahili · English</text>
      </g>
      <g class="l4">
        <text x="36" y="276"><tspan fill="#656D76">$</tspan><tspan fill="#1F2328"> git log --author=samuel --oneline </tspan><tspan fill="#656D76">| head -2</tspan></text>
        <text x="36" y="300" fill="#59636E">types(document): respect schema toObject options <tspan fill="#1F2328">(mongoose, merged)</tspan>  ·  types(model): Model.schema typed <tspan fill="#1F2328">(shipped 9.9.0)</tspan></text>
      </g>
      <g class="l5">
        <rect x="36" y="308" width="9" height="17" fill="#1F2328" class="cur"/>
      </g>
    </g>
  </g>
</svg>
