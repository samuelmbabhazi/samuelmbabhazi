<svg width="1200" height="370" viewBox="0 0 1200 370" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect width="1200" height="370" rx="20"/></clipPath>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F2328" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#1F2328" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1F2328" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#1F2328" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#1F2328" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes drift-a { 0%,100% { transform: translate(0,0);} 50% { transform: translate(46px,18px);} }
      @keyframes drift-b { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-38px,-14px);} }
      @keyframes drift-c { 0%,100% { transform: translate(0,0);} 50% { transform: translate(20px,-24px);} }
      .orb-a { animation: drift-a 11s ease-in-out infinite; }
      .orb-b { animation: drift-b 14s ease-in-out infinite 0.8s; }
      .orb-c { animation: drift-c 9s ease-in-out infinite 1.6s; }
      @keyframes blink { 0%,55% {opacity:1;} 60%,100% {opacity:0.15;} }
      .dot { animation: blink 2.2s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px);} 100% { transform: translateX(1240px);} }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes ringspin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
      .ring { transform-origin: 1030px 140px; animation: ringspin 26s linear infinite; }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="370" fill="#FFFFFF"/>
    <g class="orb-a"><circle cx="190" cy="60" r="240" fill="url(#orb)"/></g>
    <g class="orb-b"><circle cx="1030" cy="320" r="270" fill="url(#orb)"/></g>
    <g class="orb-c"><circle cx="700" cy="-40" r="190" fill="url(#orb)"/></g>
    <g class="ring" opacity="0.5">
      <circle cx="1030" cy="140" r="72" stroke="#8C959F" stroke-width="1.6" stroke-dasharray="3 9" fill="none"/>
    </g>
    <circle cx="1030" cy="140" r="46" stroke="#D1D9E0" stroke-width="1.4" fill="none"/>
    <text x="1030" y="150" text-anchor="middle" class="mono" font-size="26" fill="#1F2328">&lt;/&gt;</text>
    <text x="64" y="126" class="sans" font-size="68" font-weight="800" fill="#1F2328" letter-spacing="-2">Samuel Mbabhazi</text>
    <text x="66" y="176" class="sans" font-size="30" font-weight="700" fill="#32383F">Full-Stack Developer with 5+ Years of Experience</text>
    <rect x="66" y="196" width="690" height="2" fill="#D1D9E0"/>
    <g style="clip-path: inset(0 0 0 0);">
      <rect x="66" y="195" width="240" height="4" rx="2" fill="url(#shine)" class="sweep" opacity="0.85"/>
    </g>
    <text x="66" y="238" class="sans" font-size="23" fill="#59636E">Open source contributor, passionate about building clean, scalable web applications</text>
    <g>
      <circle cx="74" cy="278" r="5.5" fill="#1F2328" class="dot"/>
      <text x="92" y="285" class="sans" font-size="19" fill="#59636E">open to remote roles, freelance projects and open source collaboration</text>
    </g>
    <rect x="64" y="314" width="1072" height="2" rx="1" fill="url(#shine)" opacity="0.3"/>
    <text x="64" y="348" class="mono" font-size="17" fill="#656D76">my code ships in libraries downloaded millions of times a week</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="369" rx="19.5" stroke="#D1D9E0" fill="none"/>
</svg>
