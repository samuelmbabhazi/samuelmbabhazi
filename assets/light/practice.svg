<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="352" viewBox="0 0 1200 352" fill="none"><style>@font-face{font-family:'S';src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'R';src:url(data:font/woff2;base64,) format('woff2')}</style><g transform="translate(0,0)"><defs><linearGradient id="gp0" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAFAFA"/></linearGradient><radialGradient id="rp0" cx="0.15" cy="0" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#gp0)" stroke="#E4E4E7"/><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#rp0)"/><path d="M18 1.5 H572" stroke="rgba(255,255,255,1)"/><text x="28" y="54" font-family="S" font-size="19" fill="#111111" letter-spacing="-0.4">I stay the author</text><text x="28" y="88" font-family="R" font-size="15" fill="#6B6B6B">Every line is read, understood and explainable before it goes to review.</text></g><g transform="translate(610,0)"><defs><linearGradient id="gp1" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAFAFA"/></linearGradient><radialGradient id="rp1" cx="0.15" cy="0" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#gp1)" stroke="#E4E4E7"/><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#rp1)"/><path d="M18 1.5 H572" stroke="rgba(255,255,255,1)"/><text x="28" y="54" font-family="S" font-size="19" fill="#111111" letter-spacing="-0.4">Proof before fix</text><text x="28" y="88" font-family="R" font-size="15" fill="#6B6B6B">New tests fail on the original code first, then the fix, then the full suite.</text></g><g transform="translate(0,186)"><defs><linearGradient id="gp2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAFAFA"/></linearGradient><radialGradient id="rp2" cx="0.15" cy="0" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#gp2)" stroke="#E4E4E7"/><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#rp2)"/><path d="M18 1.5 H572" stroke="rgba(255,255,255,1)"/><text x="28" y="54" font-family="S" font-size="19" fill="#111111" letter-spacing="-0.4">Disclosed, always</text><text x="28" y="88" font-family="R" font-size="15" fill="#6B6B6B">Pull requests say where AI helped, following each project's own rules.</text></g><g transform="translate(610,186)"><defs><linearGradient id="gp3" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FAFAFA"/></linearGradient><radialGradient id="rp3" cx="0.15" cy="0" r="0.8"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient></defs><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#gp3)" stroke="#E4E4E7"/><rect x="0.5" y="0.5" width="589" height="165" rx="18" fill="url(#rp3)"/><path d="M18 1.5 H572" stroke="rgba(255,255,255,1)"/><text x="28" y="54" font-family="S" font-size="19" fill="#111111" letter-spacing="-0.4">Nothing confidential in a prompt</text><text x="28" y="88" font-family="R" font-size="15" fill="#6B6B6B">Client code, credentials and private data never leave the machine.</text></g></svg>