<svg width="1200" height="290" viewBox="0 0 1200 290" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <clipPath id="frame"><rect width="1200" height="290" rx="20"/></clipPath>
    <radialGradient id="orb" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <style>
      .sans { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, Menlo, monospace; }
      @keyframes drift-a { 0%,100% { transform: translate(0,0);} 50% { transform: translate(46px,18px);} }
      @keyframes drift-b { 0%,100% { transform: translate(0,0);} 50% { transform: translate(-38px,-14px);} }
      @keyframes drift-c { 0%,100% { transform: translate(0,0);} 50% { transform: translate(20px,-24px);} }
      .orb-a { animation: drift-a 11s ease-in-out infinite; }
      .orb-b { animation: drift-b 14s ease-in-out infinite 0.8s; }
      .orb-c { animation: drift-c 9s ease-in-out infinite 1.6s; }
      @keyframes blink { 0%,55% {opacity:1;} 60%,100% {opacity:0.15;} }
      .dot { animation: blink 2.2s ease-in-out infinite; }
      @keyframes sweep { 0% { transform: translateX(-320px);} 100% { transform: translateX(1240px);} }
      .sweep { animation: sweep 7s ease-in-out infinite; }
      @keyframes ringspin { from { transform: rotate(0deg);} to { transform: rotate(360deg);} }
      .ring { transform-origin: 1042px 118px; animation: ringspin 26s linear infinite; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="290" fill="#0A0A0C"/>
    <rect x="0.5" y="0.5" width="1199" height="289" rx="19.5" stroke="#26262B"/>

    <g class="orb-a"><circle cx="190" cy="60" r="230" fill="url(#orb)"/></g>
    <g class="orb-b"><circle cx="1030" cy="250" r="260" fill="url(#orb)"/></g>
    <g class="orb-c"><circle cx="700" cy="-40" r="180" fill="url(#orb)"/></g>

    <!-- rotating dashed ring, right side -->
    <g class="ring" opacity="0.5">
      <circle cx="1042" cy="118" r="64" stroke="#3F3F46" stroke-width="1.4" stroke-dasharray="3 9" fill="none"/>
    </g>
    <circle cx="1042" cy="118" r="40" stroke="#26262B" stroke-width="1.2" fill="none"/>
    <text x="1042" y="126" text-anchor="middle" class="mono" font-size="22" fill="#F4F4F5">&lt;/&gt;</text>

    <!-- name block -->
    <text x="72" y="112" class="sans" font-size="54" font-weight="800" fill="#F4F4F5" letter-spacing="-1.5">Samuel Mbabhazi</text>
    <text x="74" y="152" class="sans" font-size="22" font-weight="600" fill="#A1A1AA">Senior Full-Stack Engineer · TypeScript First</text>

    <!-- animated underline -->
    <rect x="74" y="170" width="560" height="1.5" fill="#26262B"/>
    <g style="clip-path: inset(0 0 0 0);">
      <rect x="74" y="169" width="220" height="3" rx="1.5" fill="url(#shine)" class="sweep" opacity="0.8"/>
    </g>

    <text x="74" y="206" class="mono" font-size="15.5" fill="#D4D4D8">merged into <tspan fill="#FFFFFF" font-weight="700">Mongoose</tspan> · <tspan fill="#FFFFFF" font-weight="700">NestJS ecosystem</tspan> · <tspan fill="#FFFFFF" font-weight="700">maintainer at Ever</tspan></text>

    <g>
      <circle cx="80" cy="243" r="4.5" fill="#F4F4F5" class="dot"/>
      <text x="94" y="248" class="sans" font-size="15" fill="#A1A1AA">open to remote roles, freelance projects and open source collaboration</text>
    </g>
  </g>
</svg>
