<svg width="1200" height="300" viewBox="0 0 1200 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7E3BF2"/>
      <stop offset="1" stop-color="#00D4FF"/>
    </linearGradient>
    <radialGradient id="glowV" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7E3BF2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#7E3BF2" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00D4FF" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#2A3140"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="300" fill="#0D1117"/>
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.55"/>
    <ellipse cx="150" cy="40" rx="420" ry="230" fill="url(#glowV)"/>
    <ellipse cx="1080" cy="280" rx="430" ry="240" fill="url(#glowC)"/>

    <!-- left accent bar -->
    <rect x="64" y="74" width="5" height="112" rx="2.5" fill="url(#accent)"/>

    <!-- name + role -->
    <text x="92" y="118" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="52" font-weight="800" fill="#E6EDF3" letter-spacing="-1">Samuel Mbabhazi</text>
    <text x="94" y="158" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="23" font-weight="600" fill="url(#accent)">Senior Full-Stack Engineer · TypeScript First</text>

    <!-- proof chips -->
    <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="600">
      <rect x="94" y="184" width="204" height="34" rx="17" fill="#161B22" stroke="#7E3BF2" stroke-opacity="0.55"/>
      <circle cx="114" cy="201" r="4" fill="#3FB950"/>
      <text x="126" y="206" fill="#E6EDF3">Merged into Mongoose</text>

      <rect x="310" y="184" width="230" height="34" rx="17" fill="#161B22" stroke="#7E3BF2" stroke-opacity="0.55"/>
      <circle cx="330" cy="201" r="4" fill="#3FB950"/>
      <text x="342" y="206" fill="#E6EDF3">Shipped in NestJS releases</text>

      <rect x="552" y="184" width="196" height="34" rx="17" fill="#161B22" stroke="#7E3BF2" stroke-opacity="0.55"/>
      <circle cx="572" cy="201" r="4" fill="#3FB950"/>
      <text x="584" y="206" fill="#E6EDF3">5+ years production</text>
    </g>

    <!-- terminal vignette -->
    <g>
      <rect x="836" y="64" width="300" height="118" rx="12" fill="#11151C" stroke="#262D38"/>
      <circle cx="858" cy="86" r="5" fill="#FF5F57"/>
      <circle cx="876" cy="86" r="5" fill="#FEBC2E"/>
      <circle cx="894" cy="86" r="5" fill="#28C840"/>
      <g font-family="Consolas, Menlo, monospace" font-size="13.5">
        <text x="856" y="116" fill="#8B949E">$ git log --author=samuel</text>
        <text x="856" y="138" fill="#E6EDF3">fix: Model.schema stays typed</text>
        <text x="856" y="160"><tspan fill="#3FB950">merged</tspan><tspan fill="#8B949E"> by the maintainer ✓</tspan></text>
      </g>
    </g>

    <!-- bottom rule -->
    <rect x="64" y="252" width="1072" height="2" rx="1" fill="url(#accent)" opacity="0.35"/>
    <text x="64" y="284" font-family="Consolas, Menlo, monospace" font-size="14" fill="#8B949E">my code ships in libraries downloaded millions of times a week</text>
  </g>
</svg>
